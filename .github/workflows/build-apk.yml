name: Build APK

# Builds an installable debug APK on GitHub's runners and runs the JVM unit tests.
# Download the "FRAME-debug-apk" artifact from the finished run.

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ubuntu-latest already ships the Android SDK ($ANDROID_HOME), so no setup action is needed.
      # Just make sure licences are accepted so Gradle can fetch platform 35 / build-tools.
      - name: Accept Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4

      # Files uploaded through the GitHub web UI lose the executable bit.
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Assemble debug APK
        run: ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: FRAME-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
