name: Build APK

# Builds an installable debug APK on GitHub's runners (they have the Android SDK).
# Push this project to a GitHub repo, open the Actions tab, and download the
# "FRAME-debug-apk" artifact. Also runs the JVM unit tests.

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Assemble debug APK
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: FRAME-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
